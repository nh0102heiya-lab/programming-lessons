<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666;
      --border: #e5e5e5;
      --code-bg: #f6f8fa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --code-bg: #161b22;
      }
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }

    header {
      max-width: 720px;
      margin: 32px auto 16px;
      padding: 0 16px;
    }

    main {
      max-width: 720px;
      margin: 0 auto 40px;
      padding: 0 16px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }

    code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 6px;
    }

    pre {
      background: var(--code-bg);
      padding: 12px;
      overflow-x: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ page.title }}</h1>
    <div class="meta">
      最終更新: {{ page.updated }}
    </div>
    <hr>
  </header>

  <main>
    {{ content }}
  </main>
</body>
</html>
